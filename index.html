<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资产看板</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-blue: #6366f1;
            --accent-green: #34d399;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        /* 顶部总览卡片 */
        .summary-card {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #4338ca;
            margin-bottom: 20px;
            position: relative;
        }

        .summary-title {
            font-size: 14px;
            color: #c7d2fe;
            margin-bottom: 8px;
        }

        .rate-badge {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #a5b4fc;
        }

        .total-amount {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 16px;
        }

        .sub-item-label {
            font-size: 12px;
            color: #a5b4fc;
        }

        .sub-item-val {
            font-size: 16px;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Tab 导航 */
        .tab-nav {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
            border: 1px solid var(--card-border);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--accent-blue);
            color: #ffffff;
        }

        /* 列表卡片 */
        .item-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--card-border);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-title {
            font-size: 16px;
            font-weight: 600;
        }

        .item-sub {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .item-price {
            font-size: 12px;
            color: var(--text-sub);
        }

        .item-val-usd {
            font-size: 16px;
            font-weight: 600;
            text-align: right;
        }

        .item-val-cny {
            font-size: 12px;
            color: var(--text-sub);
            text-align: right;
        }

        .updated-time {
            text-align: center;
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 20px;
        }

        .hidden { display: none; }
        .loading { text-align: center; padding: 40px; color: var(--text-sub); }
    </style>
</head>
<body>

<div class="container">
    <div id="loading" class="loading">正在获取最新资产数据...</div>

    <div id="content" class="hidden">
        <!-- 顶部总览 -->
        <div class="summary-card">
            <div class="summary-title">总资产估值 (CNY)</div>
            <div id="fx-rate" class="rate-badge">USD/CNY --</div>
            <div id="total-cny" class="total-amount">¥ 0.00</div>
            <div class="summary-grid">
                <div>
                    <div class="sub-item-label">加密资产</div>
                    <div id="crypto-usd" class="sub-item-val">$0.00</div>
                </div>
                <div>
                    <div class="sub-item-label">基金资产</div>
                    <div id="fund-cny" class="sub-item-val" style="color: var(--accent-green);">¥0.00</div>
                </div>
            </div>
        </div>

        <!-- 选项卡按钮 -->
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('crypto')">🪙 加密资产</button>
            <button class="tab-btn" onclick="switchTab('fund')">📈 基金列表</button>
        </div>

        <!-- 加密货币列表 -->
        <div id="list-crypto"></div>

        <!-- 基金列表 -->
        <div id="list-fund" class="hidden"></div>

        <div id="updated-at" class="updated-time">更新时间: --</div>
    </div>
</div>

<script>
    // 替换为你的 n8n Webhook 地址
    
const N8N_WEBHOOK_URL = 'https://129d9ad9539129.lhr.life/webhook/e753e674-5b61-4114-afcc-a2b2520f1b92';

    async function fetchAssetData() {
        try {
            const response = await fetch(N8N_WEBHOOK_URL);
            let rawData = await response.json();
            
            // 兼容数组及 body 结构包装
            if (Array.isArray(rawData)) rawData = rawData[0];
            const data = rawData.body || rawData;
            
            const summary = data.summary || {};
            // 读取 n8n 节点输出的 symbolTotals 与 fundResults
            const cryptoAssets = data.symbolTotals || data.cryptoResults || [];
            const fundAssets = data.fundResults || [];

            // 1. 渲染顶部总览
            document.getElementById('total-cny').innerText = '¥ ' + Number(summary.grandTotalValueCNY || 0).toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('crypto-usd').innerText = '$' + Number(summary.totalCryptoValueUSD || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('fund-cny').innerText = '¥' + Number(summary.totalFundValueCNY || 0).toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('fx-rate').innerText = 'USD/CNY ' + (summary.usdToCny || '--');
            document.getElementById('updated-at').innerText = '更新时间: ' + (summary.updatedAt || '--');

            // 2. 渲染加密资产列表
            const cryptoContainer = document.getElementById('list-crypto');
            if (cryptoAssets.length > 0) {
                cryptoContainer.innerHTML = cryptoAssets.map(item => `
                    <div class="item-card">
                        <div class="item-header">
                            <div>
                                <div class="item-title">${item.symbol}</div>
                                <div class="item-sub">持仓: ${Number(item.totalAmount || item.amount || 0).toLocaleString()} ${item.platforms ? `| 平台: ${item.platforms}` : ''}</div>
                            </div>
                            <div>
                                <div class="item-price">$${Number(item.priceUSD || 0).toFixed(4)}</div>
                                <div class="item-val-usd">$${Number(item.totalValueUSD || item.valueUSD || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                                <div class="item-val-cny">≈ ¥${Number(item.totalValueCNY || item.valueCNY || 0).toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } else {
                cryptoContainer.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:20px;">暂无加密资产数据</div>';
            }

            // 3. 渲染基金列表
            const fundContainer = document.getElementById('list-fund');
            if (fundAssets.length > 0) {
                fundContainer.innerHTML = fundAssets.map(item => `
                    <div class="item-card">
                        <div class="item-header">
                            <div>
                                <div class="item-title">${item.name || item.code}</div>
                                <div class="item-sub">代码: ${item.code} | 份额: ${Number(item.shares || 0).toLocaleString()}</div>
                            </div>
                            <div>
                                <div class="item-price">净值: ¥${Number(item.nav || 0).toFixed(4)}</div>
                                <div class="item-val-usd" style="color:var(--accent-green)">¥${Number(item.marketValueCNY || 0).toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } else {
                fundContainer.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:20px;">暂无基金资产数据</div>';
            }

            // 4. 展示页面内容
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');

        } catch (err) {
            document.getElementById('loading').innerText = '❌ 读取 n8n 数据失败，请确认后刷新。';
            console.error(err);
        }
    }

    // Tab 切换逻辑
    function switchTab(type) {
        const btns = document.querySelectorAll('.tab-btn');
        const cryptoList = document.getElementById('list-crypto');
        const fundList = document.getElementById('list-fund');

        if (type === 'crypto') {
            btns[0].classList.add('active');
            btns[1].classList.remove('active');
            cryptoList.classList.remove('hidden');
            fundList.classList.add('hidden');
        } else {
            btns[0].classList.remove('active');
            btns[1].classList.add('active');
            cryptoList.classList.add('hidden');
            fundList.classList.remove('hidden');
        }
    }

    // 页面加载自动获取
    fetchAssetData();
</script>

</body>
</html>
